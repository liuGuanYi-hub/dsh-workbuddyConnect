# pnpm 11 config. pnpm 11 refuses to run scripts (and to let `pnpm run <script>`
# proceed past its dependency check) unless the packages that need build steps
# are explicitly listed. Without this file pnpm auto-generates a placeholder
# containing "set this to true or false", and every `pnpm run check` fails with
# ERR_PNPM_IGNORED_BUILDS before reaching a single test.
#
# Both entries are transitive dependencies of @earendil-works/pi-ai (via
# @google/genai and protobufjs), which the plugin's dependency tree pulls in.
# The alpha line carried the same two entries (see adapt/dsh-0.1.2, 5a5fac6);
# this is the stable-line equivalent, kept deliberately minimal.
allowBuilds:
  '@google/genai': true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-app-boot@0.2.1-rc.1'
  - '@deepseek-ai/dsh-atomic-write@0.2.1-rc.1'
  - '@deepseek-ai/dsh-attachment@0.2.1-rc.1'
  - '@deepseek-ai/dsh-authorization@0.2.1-rc.1'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-model-selection@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings-plugins@0.2.1-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.1'
  - '@deepseek-ai/dsh-config-editor@0.2.1-rc.1'
  - '@deepseek-ai/dsh-credentials@0.2.1-rc.1'
  - '@deepseek-ai/dsh-fs@0.2.1-rc.1'
  - '@deepseek-ai/dsh-home-paths@0.2.1-rc.1'
  - '@deepseek-ai/dsh-host-webserver@0.2.1-rc.1'
  - '@deepseek-ai/dsh-launch-environment@0.2.1-rc.1'
  - '@deepseek-ai/dsh-llm-pi-ai@0.2.1-rc.1'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.1'
  - '@deepseek-ai/dsh-package-manifest@0.2.1-rc.1'
  - '@deepseek-ai/dsh-sandbox@0.2.1-rc.1'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.1'
  - '@deepseek-ai/dsh-session@0.2.1-rc.1'
  - '@deepseek-ai/dsh-settings@0.2.1-rc.1'
  - '@deepseek-ai/dsh-timeout@0.2.1-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.2.1-rc.1'
  - '@deepseek-ai/dsh-util-values@0.2.1-rc.1'
  - '@deepseek-ai/schemastery@3.18.5'
